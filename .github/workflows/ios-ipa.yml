name: Build unsigned IPA

# Builds an unsigned (fakesigned with ldid) IPA for TrollStore on a GitHub macOS runner.
# Three ways to start it:
#  - raise the version in app/app.json and push to main: builds and publishes Release vX.Y.Z (the tag is created here);
#  - push a tag like v1.0.0: builds and publishes a Release for it;
#  - run manually from the Actions tab: builds only, the IPA is in the run's artifacts.

on:
  workflow_dispatch:
  push:
    tags: ['v*']
    branches: [main]
    paths: ['app/app.json', '.github/workflows/ios-ipa.yml']

permissions:
  contents: write

concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # On a push to main, build only when app.json carries a version that has no tag yet.
  check:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.v.outputs.build }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
      - id: v
        run: |
          TAG="v$(node -p "require('./app/app.json').expo.version")"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF" != "refs/heads/main" ] || [ "$GITHUB_EVENT_NAME" != "push" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          elif git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists: nothing to release."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install JS dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Generate iOS project (prebuild + CocoaPods)
        run: npx expo prebuild --platform ios --clean
        env:
          CI: 1

      - name: Build app without code signing
        run: |
          set -o pipefail
          xcodebuild \
            -workspace ios/Kalorii.xcworkspace \
            -scheme Kalorii \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -quiet

      - name: Fakesign and package IPA
        run: |
          brew install ldid
          APP="build/Build/Products/Release-iphoneos/Kalorii.app"
          test -d "$APP"
          ldid -S "$APP/Kalorii"
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          VERSION=$(node -p "require('./app.json').expo.version")
          zip -qry "Kalorii-$VERSION.ipa" Payload
          ls -lh *.ipa
          echo "IPA=app/Kalorii-$VERSION.ipa" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: Kalorii-ipa
          path: ${{ env.IPA }}
          retention-days: 30

      - name: Publish release (tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.IPA }}

      - name: Publish release (new version on main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: ${{ env.IPA }}
