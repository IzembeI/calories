name: Build unsigned IPA

# Builds an unsigned (fakesigned with ldid) IPA for TrollStore on a GitHub macOS runner.
# Run manually from the Actions tab, or push a tag like v1.0.0 to also publish a Release.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install JS dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Generate iOS project (prebuild + CocoaPods)
        run: npx expo prebuild --platform ios --clean
        env:
          CI: 1

      - name: Build app without code signing
        run: |
          set -o pipefail
          xcodebuild \
            -workspace ios/Kalorii.xcworkspace \
            -scheme Kalorii \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -quiet

      - name: Fakesign and package IPA
        run: |
          brew install ldid
          APP="build/Build/Products/Release-iphoneos/Kalorii.app"
          test -d "$APP"
          ldid -S "$APP/Kalorii"
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          VERSION=$(node -p "require('./app.json').expo.version")
          zip -qry "Kalorii-$VERSION.ipa" Payload
          ls -lh *.ipa
          echo "IPA=app/Kalorii-$VERSION.ipa" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: Kalorii-ipa
          path: ${{ env.IPA }}
          retention-days: 30

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.IPA }}
